# fly.toml app configuration file generated for maintenance-app-cuqima on 2026-06-03T17:52:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maintenance-app-cuqima'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'maintenance_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
